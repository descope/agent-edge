# Agent Edge: a Cloudflare Worker that lets customers' AI agents into your site
# Clone this project, fill in the values below, then run `npm run deploy`.

name = "agent-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Keep agent detection logs so you can review them in the Cloudflare dashboard.
[observability]
enabled = true

# Run the worker in front of your site. Replace example.com with your zone.
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

[vars]
# "monitor" detects and logs agents without changing any traffic.
# "route" also redirects agents from your login pages and blocks sensitive paths.
MODE = "monitor"

# Your site's display name, used on the /agents page and in the note on login pages.
SITE_NAME = "Example Store"

# Your Descope authorization server (issuer) URL.
DESCOPE_ISSUER = "https://api.descope.com/YOUR_PROJECT_ID"

# The agent front door (see ../front-door). Without it, everything works except sending agents
# from login pages to the front door.
# FRONT_DOOR_URL = "https://agents.example.com"

# The resource identifier agents request tokens for.
RESOURCE_URL = "https://example.com/api"

# Comma-separated lists.
SCOPES_SUPPORTED = "orders:read,cart:write"
AUTHORIZATION_DETAILS_TYPES = "purchase"

# The Poppy discovery document at /.well-known/poppy.json. It names your organization and
# the same DESCOPE_ISSUER above, so agents can find the authorization server on their own.
#
# SITE_DOMAIN is the domain people name when they send an agent to you. Agents compare it to
# the host they were asked to open and reject the document if it differs, so set it whenever
# the RESOURCE_URL host it defaults to is not that domain — most often because RESOURCE_URL
# is on www or on a separate API host. "www.example.com" here never matches: an agent sent to
# either example.com or www.example.com is looking for "example.com".
# SITE_DOMAIN = "example.com"

# Scopes agents ask for when they sign a customer in.
DEVICE_SCOPES = "openid"

# APIs to advertise to agents, as JSON. A url may be a path on your own site, and is resolved
# against the host the document was asked for. Agents fetch these to learn what you offer.
# POPPY_APIS = """[{"url": "/openapi.json", "description": "Browse the catalog and place orders"}]"""

# Paths where a human would sign in. Agents that hit these get the login hint, and in route mode
# get sent to the front door once FRONT_DOOR_URL is set.
# A trailing * matches a prefix.
LOGIN_PATHS = "/login,/signin,/account/login"

# API paths. 401s from these get a WWW-Authenticate header pointing to the metadata,
# which is how MCP and OAuth clients discover Descope on their own.
API_PATHS = "/api/*"

# Add a visible "Using an AI assistant?" box, linking to the front door, to the login pages above.
INJECT_LOGIN_HINT = "true"

# Paths agents should never use directly, such as password and payment changes.
BLOCKED_AGENT_PATHS = "/account/password,/account/payment-methods*"

# User-agent substrings that suggest an unverified agent. Adjust to the traffic you see.
AGENT_USER_AGENT_PATTERNS = "ChatGPT-User,OAI-SearchBot,Claude-User,Perplexity-User,HeadlessChrome"

# Treat Cloudflare-verified bots in these categories as verified agents (requires Bot Management fields).
TRUST_CLOUDFLARE_VERIFIED_BOTS = "true"
CLOUDFLARE_AGENT_BOT_CATEGORIES = "AI Assistant"

# Optional: a shared secret for signing the agent hint passed to the front door.
# Set it as a secret rather than a var:  wrangler secret put HINT_SIGNING_SECRET
