# Reference implementation of the agent front door: a Cloudflare Worker that gets the user's
# approval with Descope. It's for trying the flow, not for production.
# Run it locally with `npm run dev`, or deploy it with `npm run deploy`.

name = "agent-edge-front-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[dev]
port = 8788

[observability]
enabled = true

# Rate limits on /connect, so the front door can't be used to flood inboxes with approval
# requests. Cloudflare supports periods of 10 or 60 seconds; add a WAF rate limiting rule
# for longer windows.
[[ratelimits]]
name = "CONNECT_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CONNECT_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[vars]
# Your site's display name, shown on the connect page and in the approval message.
SITE_NAME = "Example Store"

# The inbound app's Discovery URL, from the Descope Console. The front door reads the
# CIBA and token endpoints from it.
DESCOPE_DISCOVERY_URL = "https://api.descope.com/v1/apps/YOUR_PROJECT_ID/.well-known/openid-configuration"

# Inbound app client IDs, one per tier. VERIFIED_CLIENT_ID falls back to UNVERIFIED_CLIENT_ID.
UNVERIFIED_CLIENT_ID = "YOUR_UNVERIFIED_CLIENT_ID"
# VERIFIED_CLIENT_ID = ""

# Trusted platforms, as a JSON map from Signature-Agent origin to inbound app client ID.
TRUSTED_PLATFORMS = "{}"

# Space-separated scopes requested when an agent first connects. Read-only by default: the agent
# can browse and check orders, and steps up for each purchase.
TRUSTED_SCOPES = "openid orders:read"
VERIFIED_SCOPES = "openid orders:read"
UNVERIFIED_SCOPES = "openid orders:read"

# The scope a step-up asks for when the store sends an agent here to approve one purchase.
STEP_UP_SCOPE = "openid orders:write"

# Agents connect with the device flow when the inbound app offers it: they get a link
# to give the user. CIBA, which emails the user, is the fallback for agents that can't pass on a
# link. Set this to "false" to turn the email fallback off. Step-up always uses CIBA.
CIBA_FALLBACK = "true"

# What each tier is asking for when it first connects, shown to the user in the approval
# message ({site} is SITE_NAME). Keep it in step with the scopes above.
TRUSTED_ACCESS = "view your orders at {site}"
VERIFIED_ACCESS = "view your orders at {site}"
UNVERIFIED_ACCESS = "view your orders at {site}"

# Session cookies for browser agents. On approval, the front door sets the access token as a
# cookie the site can read (and a sealed refresh cookie only it can read), so a computer use
# agent's browser is signed in without adding an Authorization header.
# Set COOKIE_DOMAIN to your site's domain, with the front door on a subdomain of it.
# Leave it unset for local runs: browsers reject Domain=localhost, and cookies ignore ports.
SESSION_COOKIES = "true"
# COOKIE_DOMAIN = "example.com"
ACCESS_TOKEN_COOKIE = "DS"
REFRESH_TOKEN_COOKIE = "DSR"

# Set these as secrets (wrangler secret put NAME), or in .dev.vars for local runs:
#   STATE_SECRET         random string that seals request handles
#   HINT_SIGNING_SECRET  same value as the edge worker's, to trust its agent_hint
#   STEP_UP_SECRET       same value as the store's, to trust the purchases it sends agents to approve
#   PRIVATE_KEY_JWK      for private_key_jwt (npm run generate-key), or
#   CLIENT_SECRETS       JSON map from client ID to client secret
